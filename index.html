<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Бумага против Entrust</title>
<style>
/* Layout: one centred column, three screens (start, round, result). Dark plum single look like the stand. */
:root{
  --bg:#23072f; --bg2:#3a0f4d; --panel:#4a1560; --panel2:#5a1b72; --line:#7a3a92;
  --fg:#fff; --mute:#d9ccff; --accent:#ffd96b; --old:#ff8a96; --new:#52dba0; --ink:#2a0b3d;
  --font:'Roboto',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.45}
.scr{display:flex;flex-direction:column;gap:18px}
.bgc{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.app{position:relative;z-index:1;max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 40px;display:flex;flex-direction:column;gap:20px;min-height:100vh}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.eyebrow{margin:0;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:700}
.lang{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.lang button{background:transparent;color:var(--mute);border:0;padding:6px 12px;font:700 13px var(--font);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--mute);color:var(--ink)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1{margin:0;font-size:clamp(36px,9vw,64px);line-height:1.02;font-weight:900;letter-spacing:-.02em;text-wrap:balance}
h2{margin:0;font-size:clamp(24px,5vw,32px);line-height:1.15;font-weight:800;text-wrap:balance}
.sub{margin:0;color:var(--mute);font-size:18px;max-width:52ch}
.lbl{margin:0 0 8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--bg2);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:10px 14px;font:600 15px var(--font);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--mute);color:var(--ink);border-color:var(--mute)}
.btn{background:var(--accent);color:var(--ink);border:0;border-radius:4px;padding:14px 24px;font:800 18px var(--font);cursor:pointer;align-self:flex-start}
.btn:hover{filter:brightness(1.06)}
.rules{margin:0;padding:0;list-style:none;display:grid;gap:8px;color:var(--mute)}
.rules li{padding-left:18px;position:relative}
.rules li::before{content:"";position:absolute;left:0;top:.6em;width:8px;height:2px;background:var(--accent)}
.bar{display:flex;justify-content:space-between;align-items:baseline;gap:12px;color:var(--mute);font-size:14px;font-variant-numeric:tabular-nums}
.prog{height:4px;background:var(--bg2);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:20px;display:flex;flex-direction:column;gap:16px}
.phase{display:inline-block;align-self:flex-start;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;padding:4px 10px;border-radius:3px}
.phase.old{background:var(--old);color:var(--ink)}
.phase.new{background:var(--new);color:var(--ink)}
.steps{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.step{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:5px;border:1px solid var(--line);background:var(--bg2);color:var(--mute);font-size:16px;text-align:left;width:100%;font-family:var(--font)}
.step .dot{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:900;color:var(--ink)}
.step.done{opacity:.6}
.step.done .dot{background:var(--new);border-color:var(--new)}
.phase-old .step.done .dot{background:var(--old);border-color:var(--old)}
.step.cur{background:var(--fg);color:var(--ink);border-color:var(--fg);font-weight:700;cursor:pointer;position:relative;overflow:hidden}
.step.cur .dot{border-color:var(--ink)}
.step.cur .fill{position:absolute;left:0;bottom:0;height:4px;width:0;background:var(--accent)}
.step.bad{background:var(--old);border-color:var(--old);color:var(--ink)}
.step[disabled]{cursor:progress}
.step.cur:not([disabled]):hover{background:#f1e8ff}
.msg{min-height:1.4em;margin:0;color:var(--old);font-weight:700;font-size:14px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cell{background:var(--bg2);border-radius:5px;padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.cell h3{margin:0;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.cell.o h3{color:var(--old)} .cell.n h3{color:var(--new)}
.big{font-size:clamp(34px,8vw,52px);font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.cell small{color:var(--mute);font-size:14px;font-variant-numeric:tabular-nums}
.pct{font-size:clamp(56px,14vw,104px);font-weight:900;line-height:.95;color:var(--accent);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.pcttx{margin:0;font-size:20px;color:var(--fg);max-width:34ch}
.outs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.out{background:var(--bg2);border:1px solid var(--line);border-radius:5px;padding:14px}
.out b{display:block;font-size:18px;margin-bottom:4px}
.out p{margin:0;color:var(--mute);font-size:15px}
.cta{margin:0;font-size:22px;font-weight:800;text-wrap:balance}
.foot{margin-top:auto;display:grid;gap:6px}
.slogan{margin:0;font-weight:700}
.note{margin:0;font-size:12px;color:var(--mute)}
.row{display:flex;gap:12px;flex-wrap:wrap}
.btn2{background:transparent;color:var(--fg);border:2px solid var(--mute);border-radius:4px;padding:12px 20px;font:700 16px var(--font);cursor:pointer}
.bar{flex-wrap:wrap}
.act{align-self:stretch;width:100%;font-size:22px;padding:18px;touch-action:manipulation}
.act:active{transform:scale(.98)}
.meter{position:relative;height:46px;border-radius:23px;background:var(--bg2);border:1px solid var(--line);margin-top:14px}
.zone{position:absolute;top:3px;bottom:3px;border-radius:19px;background:rgba(255,217,107,.28);border:2px solid var(--accent)}
.phase-new .zone{background:rgba(82,219,160,.3);border-color:var(--new)}
.mk{position:absolute;top:-5px;bottom:-5px;width:6px;margin-left:-3px;border-radius:3px;background:#fff;box-shadow:0 0 12px #fff}
.pop{position:absolute;left:50%;top:-34px;font-size:20px;font-weight:900;opacity:0;white-space:nowrap}
.pop.go{animation:pop .8s ease-out}
.pop.bad{color:var(--old)}.pop.ok{color:var(--accent)}.pop.perf{color:var(--new)}
@keyframes pop{0%{opacity:1;transform:translateX(-50%) translateY(8px) scale(.8)}20%{transform:translateX(-50%) scale(1.15)}100%{opacity:0;transform:translateX(-50%) translateY(-14px)}}
.mgh{white-space:pre-line;margin:0;font-size:18px;font-weight:800;line-height:1.25}
.popw{position:relative;height:0}.popw .pop{top:-2px;z-index:2}
.mg{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.tb{height:8px;background:var(--bg2);border-radius:4px;overflow:hidden}
.tb i{display:block;height:100%;width:100%;background:var(--old)}.tb.g i{background:var(--new);width:0}
.pad{display:grid;gap:8px}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.tile{font:800 24px var(--font);padding:14px 0;border-radius:8px;border:1px solid var(--line);background:var(--bg2);color:var(--fg);cursor:pointer;touch-action:manipulation}
.tile:active{transform:scale(.94);background:var(--panel2)}.tile.ok{opacity:.2;pointer-events:none}
.tile.mash{font-size:60px;padding:18px 0}
.code{font-size:44px;font-weight:900;text-align:center;letter-spacing:.2em;font-variant-numeric:tabular-nums;color:var(--accent)}
.home{padding:6px 12px;font-size:13px;margin-right:auto}
.scr{position:relative}
.mrow{display:flex;align-items:center;gap:14px}
.mas{flex:none;width:84px;height:102px}.mas.big{width:120px;height:145px}.mas svg{display:block;animation:flt 3s ease-in-out infinite;filter:drop-shadow(0 0 14px rgba(255,150,255,.45))}
.mas .f{display:none}.mas[data-m=idle] .f-idle,.mas[data-m=happy] .f-happy,.mas[data-m=oops] .f-oops,.mas[data-m=wait] .f-wait{display:inline}
.mas[data-m=happy] svg{animation:jmp .5s ease-out 2}.mas[data-m=happy] .sh{animation:lk 1.2s ease-in-out}.mas[data-m=oops] svg{animation:shk .4s}
@keyframes flt{50%{transform:translateY(-5px)}}@keyframes jmp{40%{transform:translateY(-16px)}}
.bub{position:relative;background:#fff;color:var(--ink);border-radius:14px;padding:10px 14px;font-weight:700;font-size:15px;max-width:34ch;min-height:1.4em}
.bub::before{content:"";position:absolute;left:-8px;top:20px;border:8px solid transparent;border-left:0;border-right-color:#fff}
@keyframes lk{0%,55%,100%{transform:translateY(0)}15%,40%{transform:translateY(-22px)}}
@keyframes ckp{0%,40%{opacity:.15}60%,100%{opacity:1}}

.logos{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logos img{display:block;height:40px;width:auto}.logos img.en{height:30px}
.logos i{width:1px;height:36px;background:var(--line)}
.g2{grid-template-columns:repeat(2,1fr)}.tile.lit{background:var(--accent);color:var(--ink);transform:scale(1.05)}
.ic{width:1.25em;height:1.25em;vertical-align:-.22em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.g{stroke:var(--new)}.ic.r{stroke:var(--old)}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tile .ic{width:34px;height:34px;stroke:var(--accent)}.tile.mash .ic{width:64px;height:64px}
.tile .ic.g{stroke:var(--new)}.tile .ic.r{stroke:var(--old)}.tile.lit .ic{stroke:var(--ink)}
.cap{font:700 13px var(--font);color:var(--mute);line-height:1.15}
.mgh .ic{width:1.3em;height:1.3em;stroke:var(--accent)}.mgh .ic.g{stroke:var(--new)}.mgh .ic.r{stroke:var(--old)}
.cvs{display:block;width:100%;height:auto;border-radius:10px;background:var(--bg2);border:1px solid var(--line);touch-action:manipulation}
.top .logos{gap:12px;flex-wrap:nowrap}.top .logos img{height:44px;width:auto;flex:none}.top .logos img.en{height:32px}.top .logos i{flex:none;height:36px}
.mas{cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}.mas:focus-visible{outline:3px solid var(--accent);outline-offset:4px;border-radius:12px}
.mas[data-m=wow] .f-wow,.mas[data-m=giggle] .f-giggle,.mas[data-m=meh] .f-meh,.mas[data-m=annoyed] .f-annoyed,.mas[data-m=angry] .f-angry,.mas[data-m=furious] .f-furious,.mas[data-m=resign] .f-resign{display:inline}
.mas[data-m=wow] svg{animation:jmp .4s ease-out}.mas[data-m=giggle] svg{animation:shk .35s ease-in-out 3}.mas[data-m=angry] svg{animation:shk .5s ease-in-out infinite}.mas[data-m=furious] svg{animation:shk .22s linear infinite}.mas[data-m=resign] .sh{animation:lk 1.4s ease-in-out infinite}
.mas.boing svg{animation:boing .45s}@keyframes boing{30%{transform:scale(1.18,.86)}60%{transform:scale(.92,1.1)}}
.pzic{width:84px;height:84px;stroke:var(--accent)}
.pzcard{background:var(--panel);border:2px dashed var(--accent);border-radius:14px;padding:20px;text-align:center;display:grid;gap:8px;justify-items:center;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.025)}}
.pzl{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:700}
.pzcode{font-size:clamp(36px,11vw,60px);font-weight:900;letter-spacing:.1em;color:var(--accent);font-variant-numeric:tabular-nums}
.pzt{color:var(--mute);font-variant-numeric:tabular-nums}
.conf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}.conf i{position:absolute;top:-16px;width:9px;height:14px;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.shake{animation:shk .3s}
@keyframes shk{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.stars{font-size:38px;letter-spacing:.12em;color:var(--accent);line-height:1}
@media (prefers-reduced-motion:reduce){.pzcard{animation:none}.mas svg{animation:none!important}.sh,.ck{animation:none}.prog i{transition:none}.pop.go,.shake{animation:none;opacity:1}}
</style>

    var by = gy - u.y - ph, lf = u.y === 0 ? Math.floor(u.dist / 16) % 2 : 0;
    c.strokeStyle = '#d9ccff'; c.lineWidth = 4; c.beginPath(); c.arc(px + pw / 2, by + 2, 9, Math.PI, 0); c.stroke();
    c.fillStyle = '#4a1560'; c.strokeStyle = '#fff'; c.lineWidth = 3; rr(c, px, by, pw, ph - 6, 6); c.fill(); c.stroke();
    c.fillStyle = '#fff'; c.fillRect(px + 7, by + 10, 5, 7); c.fillRect(px + 18, by + 10, 5, 7);
    c.fillRect(px + 4, by + ph - 6, 8, lf ? 6 : 3); c.fillRect(px + 18, by + ph - 6, 8, lf ? 3 : 6);
  }
  function onTap() {
    var r = G.r; if (!r || r.stop || r.lock || r.mg !== 'time') return;
    r.taps++;
    var d = Math.abs(r.pos - r.c), half = r.w / 2;
    if (d > half) lose('miss'); else win(d <= half * .3, true);
  }
  function roundTxt() {
    var r = G.r, s = r.miss === 0 ? 3 : r.miss <= 2 ? 2 : 1;
    $('rStars').textContent = '★★★'.slice(0, s) + '☆☆☆'.slice(0, 3 - s);
    $('rScore').textContent = t('rscore') + ': ' + r.pts;
    $('bubR').textContent = M[lang].rnd[3 - s]; mood(s > 1 ? 'happy' : 'oops');
  }
  function endPhase() {
    var r = G.r, el = performance.now() - r.t0 + r.pen;
    if (r.phase === 'old') { r.oldTaps = r.taps; r.oldMs = el; r.phase = 'new'; r.step = 0; r.taps = 0; r.t0 = 0; r.pen = 0; $('msg').textContent = ''; drawPlay(); setup(); return; }
    G.oldTaps += r.oldTaps; G.oldMs += r.oldMs; G.newTaps += r.taps; G.newMs += el;
    G.score += r.pts; r.stop = true; cancelAnimationFrame(G.raf); roundTxt();
    $('rT').textContent = r.sc.title[lang];
    $('rOt').textContent = r.oldTaps; $('rOs').textContent = t('taps') + ' · ' + fmt(r.oldMs);
    $('rNt').textContent = r.taps; $('rNs').textContent = t('taps') + ' · ' + fmt(el);
    var last = G.i + 1 >= G.list.length;
    $('next').textContent = t(last ? 'finish' : 'next');
    $('prog').style.width = ((G.i + 1) / G.list.length * 100) + '%';
    show('sRound'); try { $('next').focus({ preventScroll: true }); } catch (e) {}
  }
  function finish() {
    var pct = Math.round(100 * (G.oldTaps - G.newTaps) / G.oldTaps);
    $('pct').textContent = pct + '%'; $('pctx').textContent = t('pctx');
    $('eO').textContent = G.oldTaps; $('eOs').textContent = t('taps') + ' · ' + fmt(G.oldMs);
    $('eN').textContent = G.newTaps; $('eNs').textContent = t('taps') + ' · ' + fmt(G.newMs);
    $('eScore').textContent = t('tscore') + ': ' + G.score + ' · ' + t('best') + ': ' + G.best;
    $('bubE').textContent = M[lang].end[G.score % 2]; mood('happy');
    show('sEnd');
  }
  $('go').onclick = newGame; $('pzBack').onclick = function () { show('sStart'); };
  document.addEventListener('keydown', function (e) { if (G && G.r && G.r.mg === 'run' && (e.code === 'Space' || e.code === 'ArrowUp') && !$('sPlay').hidden) { e.preventDefault(); jump(); } });
  $('home').onclick = function () { if (G && G.r) { G.r.stop = true; cancelAnimationFrame(G.raf); } show('sStart'); }; $('act').onclick = onTap;
  $('again').onclick = function () { show('sStart'); };
  $('next').onclick = function () { if (G.i + 1 >= G.list.length) finish(); else { G.i++; startRound(); } };
  document.querySelectorAll('.lang button').forEach(function (b) {
    b.onclick = function () {
      lang = b.getAttribute('data-lang'); try { localStorage.setItem('game-lang', lang); } catch (e) {}
      applyStatic();
      if (!$('sPlay').hidden && G) { G.r.noFocus = true; drawPlay(); setHead(); G.r.noFocus = false; $('rnd').textContent = t('round') + ' ' + (G.i + 1) + ' / ' + G.list.length; }
      if (!$('sRound').hidden && G) { $('rT').textContent = G.r.sc.title[lang]; roundTxt(); $('next').textContent = t(G.i + 1 >= G.list.length ? 'finish' : 'next'); $('rOs').textContent = t('taps') + ' · ' + fmt(G.r.oldMs || 0); }
      if (!$('sEnd').hidden) finish();
    };
  });

  // network background
  (function () {
    var c = $('bg'), x = c.getContext('2d'), W, H, pts = [];
    function size() { W = c.width = innerWidth; H = c.height = innerHeight; pts = []; var n = Math.round(W * H / 26000); for (var i = 0; i < n; i++) pts.push({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .15, vy: (Math.random() - .5) * .15 }); }
    function draw() {
      var g = x.createLinearGradient(0, 0, W, H); g.addColorStop(0, '#2a0b3d'); g.addColorStop(1, '#5a1260'); x.fillStyle = g; x.fillRect(0, 0, W, H);
      x.strokeStyle = 'rgba(217,204,255,.14)'; x.fillStyle = 'rgba(217,204,255,.35)';
      for (var i = 0; i < pts.length; i++) { var p = pts[i]; if (!reduce) { p.x += p.vx; p.y += p.vy; if (p.x < 0 || p.x > W) p.vx *= -1; if (p.y < 0 || p.y > H) p.vy *= -1; }
        for (var j = i + 1; j < pts.length; j++) { var q = pts[j], dx = p.x - q.x, dy = p.y - q.y; if (dx * dx + dy * dy < 14000) { x.beginPath(); x.moveTo(p.x, p.y); x.lineTo(q.x, q.y); x.stroke(); } }
        x.beginPath(); x.arc(p.x, p.y, 1.8, 0, 6.3); x.fill(); }
      if (!reduce) requestAnimationFrame(draw);
    }
    size(); draw(); addEventListener('resize', function () { size(); if (reduce) draw(); });
  })();

  applyStatic(); show('sStart');
})();
</script>
